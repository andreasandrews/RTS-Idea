<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Rivals Mini-Prototype</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        canvas { display: block; touch-action: none; }
        .stat { font-size: 18px; font-weight: bold; text-shadow: 2px 2px black; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Tiberium: <span id="res">0</span></div>
        <div class="stat" id="msg">Tap unit, then tap map to move</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const resEl = document.getElementById('res');

        let resources = 0;
        let selectedUnit = null;
        
        // Game Objects
        const zones = [
            { x: 0.5, y: 0.3, radius: 50, owner: 'neutral' },
            { x: 0.5, y: 0.5, radius: 50, owner: 'neutral' },
            { x: 0.5, y: 0.7, radius: 50, owner: 'neutral' }
        ];

        const units = [
            { id: 1, x: 100, y: 100, targetX: 100, targetY: 100, color: '#00ff00', size: 15 }
        ];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function update() {
            resources += 0.05;
            resEl.innerText = Math.floor(resources);

            units.forEach(u => {
                const dx = u.targetX - u.x;
                const dy = u.targetY - u.y;
                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                    u.x += dx * 0.05;
                    u.y += dy * 0.05;
                }

                // Check Zone Capture
                zones.forEach(z => {
                    const dist = Math.hypot(u.x - (z.x * canvas.width), u.y - (z.y * canvas.height));
                    if (dist < z.radius) z.owner = 'player';
                });
            });
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Zones
            zones.forEach(z => {
                ctx.beginPath();
                ctx.arc(z.x * canvas.width, z.y * canvas.height, z.radius, 0, Math.PI * 2);
                ctx.strokeStyle = z.owner === 'player' ? '#00ff00' : '#555';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = z.owner === 'player' ? 'rgba(0,255,0,0.2)' : 'transparent';
                ctx.fill();
            });

            // Draw Units
            units.forEach(u => {
                ctx.beginPath();
                ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
                ctx.fillStyle = u.color;
                ctx.fill();
                if (selectedUnit === u) {
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('pointerdown', (e) => {
            const clickedUnit = units.find(u => Math.hypot(u.x - e.clientX, u.y - e.clientY) < 30);
            if (clickedUnit) {
                selectedUnit = clickedUnit;
            } else if (selectedUnit) {
                selectedUnit.targetX = e.clientX;
                selectedUnit.targetY = e.clientY;
            }
        });

        window.addEventListener('resize', init);
        init();
        loop();
    </script>
</body>
</html>
